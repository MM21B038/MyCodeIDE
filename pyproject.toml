[project]
name = "mycodeide-context-engine"
version = "0.1.0"
description = "Backend-first context engine for AI coding assistants."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.9.0",
  "uvicorn>=0.30.0",
  "jupyter>=1.1.1",
  "ipykernel>=7.2.0",
  "tree-sitter>=0.25.2",
  "tree-sitter-languages>=1.10.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]
embeddings = [
  "sentence-transformers>=3.0.0",
]

[project.scripts]
context-engine = "context_engine.cli:main"
context-engine-desktop = "context_engine.desktop:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.tmp/pytest"
cache_dir = ".tmp/pytest/cache"
