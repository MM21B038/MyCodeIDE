[engine]
max_files = 5000
max_file_size_bytes = 256000
default_window = 20
top_k_chunks = 8
top_k_files = 5

[llm]
provider = "openai_compatible"
model = "gpt-4o-mini"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 60
temperature = 0.1

[embeddings]
provider = "sentence_transformers"
model = "all-MiniLM-L6-v2"

